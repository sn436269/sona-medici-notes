name: Publish daily language lesson
on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/language-daily.yml'
      - 'language-study/scripts/cloud-publish.mjs'
      - 'language-study/scripts/prepared-week.json'
permissions:
  contents: write
  pages: write
concurrency:
  group: language-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the prepared week
        run: node language-study/scripts/cloud-publish.mjs --check
      - name: Publish and verify today's lesson
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node language-study/scripts/cloud-publish.mjs
