<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1180" viewBox="0 0 1920 1180">
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#d2bea5" opacity=".3"/></pattern>
  <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ae3e3c" stroke-width="2" stroke-linecap="round"/></marker>
  <marker id="arrowInk" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#3f5564" stroke-width="2" stroke-linecap="round"/></marker>
  <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#ab772e" stroke-width="2" stroke-linecap="round"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#7c6547" flood-opacity=".12"/></filter>
</defs>
<rect width="1920" height="1180" fill="#f8f2e8"/>
<rect width="1920" height="1180" fill="url(#dots)"/>
<path d="M25,25 H1895 V1155 H25 Z" stroke="#c3a682" stroke-width="2" fill="none" stroke-dasharray="9 9"/>
<text x="82" y="102" fill="#2b3434" font-family="Noto Serif CJK TC" font-weight="700" font-size="59">從猶太教到基督宗教</text>
<text x="88" y="150" fill="#8e5a46" font-family="Noto Sans CJK TC" font-size="25">一張圖看懂：起源、羅馬帝國、教會分歧、宗教改革與《聖經》</text>
<rect x="1337" y="58" width="475" height="73" rx="34" fill="#e9dfca" stroke="#aa7c48" stroke-width="2"/>
<text x="1575" y="103" text-anchor="middle" fill="#70522b" font-family="Noto Sans CJK TC" font-weight="700" font-size="26">手繪歷史關係圖 · 繁體中文版</text>
<line x1="1265" y1="185" x2="1265" y2="1075" stroke="#cdb89a" stroke-dasharray="7 10" stroke-width="3"/>

<text x="85" y="204" font-family="Noto Sans CJK TC" font-size="27" font-weight="700" fill="#9e513d" text-anchor="start">① 兩條延續至今的歷史路線</text>
<rect x="75" y="230" width="403" height="173" rx="24" fill="#e9f0f2" stroke="#7194a4" stroke-width="3" filter="url(#shadow)"/>
<text x="102" y="277" font-family="Noto Sans CJK TC" font-size="42" font-weight="700" fill="#26546c" text-anchor="start">猶太教</text>
<text x="102" y="319" font-family="Noto Sans CJK TC" font-size="25" font-weight="400" fill="#25333a" text-anchor="start">古代以色列宗教傳統</text>
<text x="102" y="354" font-family="Noto Sans CJK TC" font-size="23" font-weight="400" fill="#25333a" text-anchor="start">《塔納赫》 · 獨一神信仰</text>
<text x="102" y="386" font-family="Noto Sans CJK TC" font-size="22" font-weight="700" fill="#3f6671" text-anchor="start">並未被基督宗教取代</text>
<path d="M480 291 C535 291, 532 290, 566 290" stroke="#ab772e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowGold)"/>
<text x="517" y="249" font-family="Noto Sans CJK TC" font-size="20" font-weight="700" fill="#a06e39" text-anchor="middle">歷史背景</text>
<rect x="574" y="227" width="614" height="174" rx="24" fill="#fff5df" stroke="#bd9556" stroke-width="3" filter="url(#shadow)"/>
<text x="608" y="273" font-family="Noto Sans CJK TC" font-size="39" font-weight="700" fill="#754b2b" text-anchor="start">耶穌與早期基督宗教</text>
<text x="610" y="318" font-family="Noto Sans CJK TC" font-size="27" font-weight="400" fill="#25333a" text-anchor="start">公元1世紀 · 在猶太社會中興起</text>
<text x="610" y="355" font-family="Noto Sans CJK TC" font-size="24" font-weight="400" fill="#25333a" text-anchor="start">門徒傳播信仰，逐漸形成教會群體</text>
<path d="M278 404 L278 449" stroke="#3f5564" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowInk)"/>
<rect x="91" y="471" width="370" height="91" rx="18" fill="#eef4f2" stroke="#88a7a1" stroke-width="3" filter="url(#shadow)"/>
<text x="276" y="508" font-family="Noto Sans CJK TC" font-size="26" font-weight="700" fill="#315e60" text-anchor="middle">猶太教持續發展至今</text>
<text x="276" y="539" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#315e60" text-anchor="middle">與基督宗教並行存在</text>
<path d="M876 403 L876 440" stroke="#3f5564" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowInk)"/>
<rect x="567" y="460" width="621" height="124" rx="24" fill="#f0e9db" stroke="#a58c65" stroke-width="3" filter="url(#shadow)"/>
<text x="603" y="507" font-family="Noto Sans CJK TC" font-size="38" font-weight="700" fill="#6f4b35" text-anchor="start">羅馬帝國時期</text>
<text x="604" y="536" font-family="Noto Sans CJK TC" font-size="23" font-weight="400" fill="#25333a" text-anchor="start">313 信仰合法化  ·  380 取得國教地位</text>
<text x="604" y="571" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#25333a" text-anchor="start">395 東西政治分治（不等於教會分裂）</text>
<path d="M567 520 C506 520 502 620 452 620" stroke="#ae3e3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowRed)"/>
<rect x="74" y="607" width="383" height="170" rx="24" fill="#f5ebec" stroke="#b97c82" stroke-width="3" filter="url(#shadow)"/>
<text x="101" y="648" font-family="Noto Sans CJK TC" font-size="25" font-weight="700" fill="#973c4d" text-anchor="start">451年｜另一條古老傳統</text>
<text x="101" y="690" font-family="Noto Sans CJK TC" font-size="32" font-weight="700" fill="#8b3349" text-anchor="start">東方正統教會</text>
<text x="101" y="725" font-family="Noto Sans CJK TC" font-size="22" font-weight="400" fill="#25333a" text-anchor="start">如科普特、亞美尼亞教會</text>
<text x="101" y="753" font-family="Noto Sans CJK TC" font-size="22" font-weight="700" fill="#a23d4c" text-anchor="start">≠ 東正教（名稱不同）</text>
<path d="M876 586 L876 642" stroke="#3f5564" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowInk)"/>
<rect x="580" y="661" width="597" height="115" rx="24" fill="#f3e6d3" stroke="#b59061" stroke-width="3" filter="url(#shadow)"/>
<text x="877" y="709" font-family="Noto Sans CJK TC" font-size="32" font-weight="700" fill="#795330" text-anchor="middle">1054年｜東西教會大分裂</text>
<text x="877" y="752" font-family="Noto Sans CJK TC" font-size="23" font-weight="400" fill="#65533d" text-anchor="middle">數百年逐漸分離的重要象徵</text>
<path d="M812 779 C812 805 677 806 677 839" stroke="#ae3e3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowRed)"/>
<path d="M953 779 C953 805 1077 806 1077 839" stroke="#3f5564" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowInk)"/>
<rect x="492" y="858" width="362" height="117" rx="24" fill="#fbe8e7" stroke="#b66b68" stroke-width="3" filter="url(#shadow)"/>
<text x="673" y="905" font-family="Noto Sans CJK TC" font-size="39" font-weight="700" fill="#9b3737" text-anchor="middle">天主教</text>
<text x="673" y="947" font-family="Noto Sans CJK TC" font-size="22" font-weight="400" fill="#25333a" text-anchor="middle">西方拉丁教會 · 羅馬教宗</text>
<rect x="892" y="858" width="309" height="117" rx="24" fill="#ecebf6" stroke="#867fb2" stroke-width="3" filter="url(#shadow)"/>
<text x="1046" y="905" font-family="Noto Sans CJK TC" font-size="39" font-weight="700" fill="#594e86" text-anchor="middle">東正教</text>
<text x="1046" y="947" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#25333a" text-anchor="middle">東方教會 · 多個自治教會</text>
<path d="M671 979 L671 1001" stroke="#ae3e3c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowRed)"/>
<rect x="474" y="1008" width="403" height="94" rx="19" fill="#edf2fd" stroke="#6684a6" stroke-width="3" filter="url(#shadow)"/>
<text x="675" y="1048" font-family="Noto Sans CJK TC" font-size="26" font-weight="700" fill="#325b88" text-anchor="middle">1517年｜宗教改革</text>
<text x="675" y="1080" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#325b88" text-anchor="middle">形成基督新教多元傳統</text>
<rect x="1305" y="202" width="534" height="69" rx="19" fill="#d6e2e8" stroke="#6b8894" stroke-width="3" filter="url(#shadow)"/>
<text x="1572" y="247" font-family="Noto Sans CJK TC" font-size="30" font-weight="700" fill="#2c515f" text-anchor="middle">② 《聖經》與《舊約》《新約》</text>
<text x="1318" y="304" font-family="Noto Sans CJK TC" font-size="30" font-weight="700" fill="#763f30" text-anchor="start">基督宗教：《聖經》</text>
<rect x="1311" y="325" width="525" height="101" rx="20" fill="#f9e1cf" stroke="#bf8461" stroke-width="3" filter="url(#shadow)"/>
<text x="1573" y="369" font-family="Noto Sans CJK TC" font-size="38" font-weight="700" fill="#7c4029" text-anchor="middle">聖經（Bible）</text>
<text x="1573" y="404" font-family="Noto Sans CJK TC" font-size="24" font-weight="400" fill="#7c4029" text-anchor="middle">由《舊約》與《新約》組成</text>
<path d="M1568 427 L1568 459" stroke="#ab772e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M1423 459 L1724 459" stroke="#ab772e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M1423 459 L1423 480" stroke="#ab772e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowGold)"/>
<path d="M1724 459 L1724 480" stroke="#ab772e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#arrowGold)"/>
<rect x="1305" y="501" width="242" height="140" rx="18" fill="#f8e7b8" stroke="#af9152" stroke-width="3" filter="url(#shadow)"/>
<text x="1426" y="556" font-family="Noto Sans CJK TC" font-size="42" font-weight="700" fill="#72501e" text-anchor="middle">《舊約》</text>
<text x="1426" y="596" font-family="Noto Sans CJK TC" font-size="19" font-weight="400" fill="#25333a" text-anchor="middle">古代以色列經典傳統</text>
<text x="1426" y="625" font-family="Noto Sans CJK TC" font-size="19" font-weight="400" fill="#25333a" text-anchor="middle">各教會卷數有差異</text>
<rect x="1596" y="501" width="246" height="140" rx="18" fill="#e8e8f8" stroke="#9897bd" stroke-width="3" filter="url(#shadow)"/>
<text x="1719" y="556" font-family="Noto Sans CJK TC" font-size="42" font-weight="700" fill="#514b92" text-anchor="middle">《新約》</text>
<text x="1719" y="596" font-family="Noto Sans CJK TC" font-size="19" font-weight="400" fill="#25333a" text-anchor="middle">耶穌與早期教會文獻</text>
<text x="1719" y="625" font-family="Noto Sans CJK TC" font-size="24" font-weight="700" fill="#514b92" text-anchor="middle">27卷</text>
<text x="1319" y="712" font-family="Noto Sans CJK TC" font-size="29" font-weight="700" fill="#2c5d77" text-anchor="start">猶太教：《塔納赫》</text>
<rect x="1311" y="732" width="526" height="139" rx="20" fill="#e2eff0" stroke="#7a9e9f" stroke-width="3" filter="url(#shadow)"/>
<text x="1573" y="781" font-family="Noto Sans CJK TC" font-size="28" font-weight="700" fill="#2a5b68" text-anchor="middle">希伯來聖經（Tanakh）</text>
<text x="1573" y="817" font-family="Noto Sans CJK TC" font-size="23" font-weight="400" fill="#2d5965" text-anchor="middle">律法書 · 先知書 · 聖卷</text>
<text x="1573" y="852" font-family="Noto Sans CJK TC" font-size="21" font-weight="700" fill="#2d5965" text-anchor="middle">猶太教不接受《新約》為經典</text>
<rect x="1308" y="902" width="528" height="206" rx="19" fill="#fff8e9" stroke="#c6a46f" stroke-width="3" filter="url(#shadow)"/>
<text x="1339" y="944" font-family="Noto Sans CJK TC" font-size="27" font-weight="700" fill="#7b5536" text-anchor="start">小提醒｜常見卷數</text>
<text x="1339" y="983" font-family="Noto Sans CJK TC" font-size="22" font-weight="400" fill="#25333a" text-anchor="start">基督新教：舊約39＋新約27＝66卷</text>
<text x="1339" y="1019" font-family="Noto Sans CJK TC" font-size="22" font-weight="400" fill="#25333a" text-anchor="start">天主教：舊約46＋新約27＝73卷</text>
<text x="1339" y="1055" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#25333a" text-anchor="start">東正教：舊約正典範圍依教會而異</text>
<text x="1339" y="1085" font-family="Noto Sans CJK TC" font-size="21" font-weight="400" fill="#25333a" text-anchor="start">希伯來聖經傳統上計為24卷</text>
<text x="84" y="1139" font-family="Noto Sans CJK TC" font-size="20" font-weight="400" fill="#827568" text-anchor="start">圖解說明：宗教史不是單一路線的「被取代」；教會發展與分歧是漫長過程。</text>
<text x="1832" y="1145" font-family="Noto Sans CJK TC" font-size="18" font-weight="400" fill="#a18466" text-anchor="end">歷史圖鑑｜原創重製</text>
</svg>